<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Read a book | wrightnote</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <div class="navbar">
            <h1>wrightnote</h1>
            <nav>
                <a href="/">Home</a>
                <a href="/#books">Books</a>
                <a href="/#categories">Categories</a>
            </nav>
            <button class="theme-toggle" id="themeToggle" type="button" aria-pressed="false">Dark mode</button>
        </div>
    </header>

    <main class="book-reader-page">
        <a class="back-to-books" href="/#books">&larr; Back to books</a>
        <div id="bookContent" aria-live="polite">
            <p class="reader-message">Loading book...</p>
        </div>
    </main>

    <script src="book.js"></script>
</body>

</html>
